[package]
name = "hiverouter-tools"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "hiverouter_tools"
path = "src/lib.rs"

[[bin]]
name = "hiverouter-cli"
path = "src/bin/hiverouter.rs"

[[bench]]
name = "engine_benches"
path = "benches/engine_benches.rs"
harness = false

[dependencies]
hiverouter-contract = { path = "../hiverouter-contract" }
hiverouter-provider = { path = "../hiverouter-provider" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
sysinfo.workspace = true
schemars.workspace = true
jsonschema.workspace = true
strum.workspace = true
uuid.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
tokio-util.workspace = true
notify.workspace = true
reqwest.workspace = true

[target.'cfg(windows)'.dependencies]
win32job.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "process", "io-util"] }
criterion = "=0.8.2"

