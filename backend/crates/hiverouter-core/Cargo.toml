[package]
name = "hiverouter-core"
version = "1.2.0-dev"
edition = "2021"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
publish = false
description = "HiveMind v1 backend: localhost axum server, SQLite bootstrap, run/task stores."
build = "build.rs"

[[bin]]
name = "hiverouter"
path = "src/main.rs"

[lib]
name = "hiverouter_core"
path = "src/lib.rs"

[dependencies]
hiverouter-contract = { path = "../hiverouter-contract" }
hiverouter-provider = { path = "../hiverouter-provider" }
hiverouter-tools = { path = "../hiverouter-tools" }
tokio = { workspace = true }
axum = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tower-http = { workspace = true }
tokio-util = { workspace = true }
petgraph = { workspace = true }
prompty = { workspace = true }
async-trait = { workspace = true }
rust-embed = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }

