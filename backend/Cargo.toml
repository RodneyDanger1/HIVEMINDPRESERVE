[workspace]
resolver = "2"
members = [
  "crates/hiverouter-contract",
  "crates/hiverouter-core",
  "crates/hiverouter-provider",
  "crates/hiverouter-tools",
]

[workspace.package]
edition = "2021"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "process", "io-util"] }
axum = { version = "=0.8.9", features = ["ws"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["preserve_order"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
rust-embed = { version = "=8.13.0", features = ["interpolate-folder-path"] }
prompty = "=2.1.0"
petgraph = "=0.8.3"
tokio-util = { version = "=0.7.20", features = ["rt"] }
tower-http = { version = "=0.7.1", features = ["trace", "cors", "limit", "request-id", "fs"] }
schemars = "=1.2.3"
jsonschema = { version = "=0.60.2", default-features = false }
notify = "=8.2.1"
thiserror = "=2.0.21"
zeroize = { version = "=1.9.1", features = ["derive"] }
win32job = "=2.0.3"
strum = { version = "=0.28.0", features = ["derive"] }
rust_decimal = { version = "=1.43.0", features = ["serde-with-str"] }
tracing-appender = "=0.2.5"
sysinfo = "=0.40.1"
uuid = { version = "=1.29.0", features = ["v7", "serde"] }
async-trait = "=0.1.89"
tempfile = "=3.23.0"
wiremock = "=0.6.5"

[profile.dev]
debug = 0
incremental = false
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
